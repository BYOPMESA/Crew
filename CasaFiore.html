<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Fiore - Menu</title>

<style>
/* =========================================================
   CASA FIORE - STYLES
   Colours live in :root. Change them here to re-theme.
   ========================================================= */
:root {
  --ivory: #F6EBDD;
  --paper: #FFF9EF;
  --tomato: #b4442a;           /* restrained terracotta: Add buttons, logo, accents */
  --tomato-dark: #933420;
  --basil: #2f6b3a;
  --butter: #f3dc8a;
  --olive: #4d4a2c;
  --olive-line: #dccfb0;
  --ink: #2b2c19;              /* dark olive text */
  --ink-soft: #655f44;
  --red: #b3261e;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --tabs-offset: 76px;         /* gap kept above a section when jumping to it (set by script) */
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}

body {
  margin: 0;
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.4;
  color: var(--ink);
  /* plaster-like ivory: soft afternoon light from the top-left, a touch of shade
     bottom-right, and a very fine grain. All CSS, no images. */
  background-color: var(--ivory);
  background-image:
    radial-gradient(ellipse 90% 60% at 8% 0%, rgba(255, 246, 222, 0.85), transparent 70%),
    linear-gradient(118deg, rgba(255, 238, 200, 0.45) 0%, transparent 42%),
    linear-gradient(to bottom right, transparent 55%, rgba(150, 105, 60, 0.08)),
    radial-gradient(rgba(110, 80, 40, 0.05) 1px, transparent 1.3px),
    radial-gradient(rgba(110, 80, 40, 0.035) 1px, transparent 1.3px);
  background-size: 100% 900px, 100% 900px, 100% 100%, 7px 7px, 13px 13px;
  background-position: 0 0, 0 0, 0 0, 0 0, 3px 5px;
  background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat;
  -webkit-tap-highlight-color: rgba(180, 68, 42, 0.15);
}

/* Illustration colours (used inside the drawings below) */
.icon { width: 1em; height: 1em; flex: none; }
.s  { stroke: #5b4a2a; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.fn { fill: none; }
.fr { fill: #d9432f; } .fg { fill: #5a9a45; } .fd { fill: #2f6b3a; } .fy { fill: #f6d768; }
.fc { fill: #fff6e0; } .fb { fill: #e7b878; } .fp { fill: #f2d38a; } .fk { fill: #7a4a2a; }
.fo { fill: #f3a65a; } .fw { fill: #cfe8ee; } .fm { fill: #d9a98a; } .fl { fill: #f9f0a8; }
.fs { fill: #f4b9c4; }
.hl { fill: none; stroke: #fff6e0; stroke-width: 2; stroke-linecap: round; }

/* ---------- Café awning (narrow scalloped strip) ---------- */
.awning {
  height: 22px;
  background: repeating-linear-gradient(90deg, #c98568 0 20px, #fbf0dd 20px 40px);   /* muted terracotta + cream */
  -webkit-mask: linear-gradient(#000, #000) 0 0 / 100% 14px no-repeat,
                radial-gradient(circle at 10px 0, #000 9.5px, transparent 10.5px) 0 14px / 20px 8px repeat-x;
          mask: linear-gradient(#000, #000) 0 0 / 100% 14px no-repeat,
                radial-gradient(circle at 10px 0, #000 9.5px, transparent 10.5px) 0 14px / 20px 8px repeat-x;
  filter: drop-shadow(0 1px 0 rgba(77, 74, 44, 0.2));
}

/* ---------- Page + paper menu ---------- */
/* overflow-x: clip stops any sideways scroll without breaking the sticky tabs */
.page {
  position: relative; overflow-x: clip;
  padding: 4px 10px calc(88px + env(safe-area-inset-bottom));   /* room so nothing hides behind the cart bar */
}
.paper {
  --pad: 16px;
  position: relative;
  max-width: 960px;
  margin: 10px auto 0;
  padding: 14px var(--pad) 24px;
  background: var(--paper);
  border: 1px solid var(--olive-line);
  border-radius: 20px;
  /* layered, restrained shadows + a fine top highlight give natural depth */
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.8),
    0 1px 2px rgba(90, 60, 30, 0.10),
    0 8px 18px -6px rgba(90, 60, 30, 0.16),
    0 24px 44px -18px rgba(90, 60, 30, 0.18);
}

/* ---------- Brand ---------- */
.brand { display: flex; align-items: center; gap: 12px; }
.brand .flower { width: 44px; height: 44px; flex: none; }
.logo {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 700;
  font-size: 2.3rem;
  line-height: 1;
  color: var(--tomato);
  letter-spacing: -0.5px;
}

/* ---------- Hero ---------- */
.hero {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 12px; padding: 14px 14px 14px 16px;
  background: linear-gradient(135deg, #fbf0da, #f6e4c4);
  border: 1px solid var(--olive-line); border-radius: 16px;
  animation: fadeUp 0.5s ease-out both;
}
.hero-text { min-width: 0; }
.eyebrow { margin: 0; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--basil); }
.hero h2 { margin: 3px 0 10px; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 1.5rem; line-height: 1.12; color: var(--ink); }

/* ---------- Chef scene: a 14s cooking loop made of separate SVG groups ----------
   .L groups run the loop (all share one 14s clock, so they stay in step).
   .T groups only run when the chef is tapped (a short dough toss).
   The CSS below sets each part to its FINISHED pose, so with reduced motion
   (or if animation fails) you see the chef presenting the finished pizza. */
.hero { position: relative; flex-direction: column; align-items: stretch; gap: 8px; }
.hero > *:not(.pennants) { position: relative; z-index: 1; }     /* text and chef always sit above the decorations */
.scene { position: relative; width: 100%; max-width: 420px; margin: 0 auto; }
.stage-box { position: relative; }
.scene .stage { display: block; width: 100%; height: auto; }
.chef-hit { position: absolute; left: 17%; top: 7%; width: 28%; height: 90%; padding: 0; background: transparent; border: 0; border-radius: 16px; cursor: pointer; }
@media (hover: hover) { .chef-hit:hover { background: rgba(255, 255, 255, 0.14); } }

/* Chef speed: 0.5x / 1x / 1.5x / 2x (the script sets one shared playback rate) */
.speed { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px; margin-top: 6px; }
.speed-label { font-size: 0.78rem; font-weight: 700; color: var(--olive); margin-right: 2px; }
.speed button {
  min-width: 42px; min-height: 40px; padding: 0 8px;
  font: inherit; font-size: 0.85rem; font-weight: 800; color: var(--olive);
  background: #fff; border: 1px solid var(--olive-line); border-radius: 10px; cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.18s;
}
.speed button:hover { border-color: var(--olive); }
.speed button:active { transform: translateY(1px) scale(0.97); }
.speed button[aria-pressed="true"] { background: var(--basil); border-color: var(--basil); color: #fff; }

/* ---------- Café atmosphere (decoration only: behind content, no pointer events) ---------- */
/* sunlit café-wall glow behind the hero */
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 120% at 90% -15%, rgba(255, 224, 140, 0.7), transparent 65%),
    linear-gradient(112deg, rgba(255, 245, 216, 0.6), transparent 52%);
  animation: kSun 12s ease-in-out infinite alternate;
}
@keyframes kSun { from { opacity: 0.72; } to { opacity: 1; } }

/* pennant string along the hero's upper edge */
.pennants { position: absolute; left: 0; right: 0; top: -9px; width: 100%; height: 26px; z-index: 0; pointer-events: none; }
.pennants .pn { transform-box: view-box; animation: kSway 5s ease-in-out infinite alternate; }
@keyframes kSway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

/* espresso cup + drifting basil in the outer margins (wide screens only) */
.deco { display: none; position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.deco svg { position: absolute; }
.deco-cup { width: 64px; height: 64px; left: max(8px, calc((50vw - 480px) / 2 - 32px)); bottom: 100px; }
.deco-steam { animation: kWisp 5.5s ease-in-out infinite; opacity: 0; }
@keyframes kWisp {
  0% { opacity: 0; transform: translateY(2px); } 35% { opacity: 0.5; } 100% { opacity: 0; transform: translateY(-9px); }
}
.deco-leaf { width: 40px; height: 40px; opacity: 0.85; animation: kDrift 26s ease-in-out infinite alternate; }
.deco-leaf.l1 { left: max(10px, calc((50vw - 480px) / 2 - 20px)); top: 24%; }
.deco-leaf.l2 { right: max(10px, calc((50vw - 480px) / 2 - 20px)); top: 52%; animation-delay: -11s; transform: scaleX(-1); }
@keyframes kDrift {
  from { transform: translate(0, 0) rotate(-8deg); } to { transform: translate(8px, 56px) rotate(14deg); }
}
@media (min-width: 1120px) { .deco { display: block; } }

/* "Background effects" switch: stops only the decorations above (never the chef) */
.fx-toggle {
  min-height: 36px; padding: 0 12px; margin-top: 8px;
  font: inherit; font-size: 0.8rem; font-weight: 700; color: var(--olive);
  background: rgba(255, 255, 255, 0.7); border: 1px solid var(--olive-line); border-radius: 999px; cursor: pointer;
  transition: background 0.2s, transform 0.18s;
}
.fx-toggle:hover { background: #fff; }
.fx-toggle:active { transform: translateY(1px) scale(0.97); }
.hero .fx-toggle { display: none; align-self: flex-start; }
.fx-off .hero::before, .fx-off .pennants .pn, .fx-off .deco-steam, .fx-off .deco-leaf { animation: none; }
.fx-off .deco-steam { opacity: 0.3; }
@media (min-width: 760px) { .hero .fx-toggle { display: inline-flex; align-items: center; } .foot .fx-toggle { display: none; } }

.scene .L, .scene .T { transform-box: view-box; }
.scene .L { animation: 14s ease-in-out infinite both; }
.scene.hold .L { animation-play-state: paused; }      /* paused by the button, off-screen, hidden tab, or during a tap toss */

.scene .doughBall { opacity: 0; transform-origin: 184px 131px; animation-name: kDough; }
.scene .pizza     { transform-origin: 184px 137px; animation-name: kPizza; }
.scene .sauce     { transform-origin: 184px 137px; animation-name: kSauce; }
.scene .top       { animation-name: kTop; }
.scene .cooked    { opacity: 0.32; animation-name: kCooked; }
.scene .steam     { opacity: 0.6; animation-name: kSteam; }
.scene .glow      { opacity: 0.45; animation-name: kGlow; }
.scene .bloom     { opacity: 0.3; animation-name: kBloom; }
.scene .armR      { transform: rotate(38deg); transform-origin: 152px 100px; animation-name: kArmR; }
.scene .spoon     { opacity: 0; animation-name: kSpoon; }
.scene .armL      { transform: rotate(-82deg); transform-origin: 108px 100px; animation-name: kArmL; }
.scene .bow       { transform-origin: 130px 148px; animation-name: kBow; }
.scene .pupils    { animation-name: kGlance; }
.scene .eyeR      { transform-origin: 137px 68px; animation-name: kWink; }
.scene .footR     { transform-origin: 133px 187px; animation-name: kFoot; }
.scene .bonus, .scene .bubble { opacity: 0; }

@keyframes kDough {
  0%    { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  9%    { transform: translate(0, 0) rotate(0deg) scale(1.18, .78); }
  12%   { transform: translate(0, 0) rotate(0deg) scale(.92, 1.1); }
  15%   { transform: translate(0, 0) rotate(0deg) scale(1.2, .76); }
  18%   { transform: translate(0, 0) rotate(0deg) scale(.95, 1.08); }
  21%   { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  22%   { transform: translate(0, 2px) rotate(0deg) scale(1.25, .7); }
  24%   { transform: translate(-2px, -30px) rotate(0deg) scale(.9, 1.1); }
  26%   { transform: translate(-6px, -70px) rotate(180deg) scale(1.5, .35); }
  28%   { transform: translate(-8px, -92px) rotate(360deg) scale(1.9, 1); }
  29.5% { transform: translate(-6px, -70px) rotate(540deg) scale(2.2, .3); }
  31%   { transform: translate(-2px, -20px) rotate(680deg) scale(2.5, .8); }
  31.5% { opacity: 1; transform: translate(0, 6px) rotate(720deg) scale(2.6, .545); }
  33%   { opacity: 1; transform: translate(0, 6px) rotate(720deg) scale(2.7, .5); }
  35%   { opacity: 0; transform: translate(0, 6px) rotate(720deg) scale(2.6, .545); }
  93%   { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.6, .6); }
  100%  { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1, 1); }
}
@keyframes kPizza {
  0%, 33% { opacity: 0; transform: translate(0, 0) scale(1); }
  35%, 54% { opacity: 1; transform: translate(0, 0) scale(1); }
  59%   { opacity: 1; transform: translate(70px, -2px) scale(.98); }
  63%   { opacity: 1; transform: translate(118px, -4px) scale(.72); }
  64%, 74% { opacity: 0; transform: translate(118px, -4px) scale(.72); }
  75.5% { opacity: 1; transform: translate(118px, -4px) scale(.72); }
  86%, 93% { opacity: 1; transform: translate(0, 0) scale(1); }
  100%  { opacity: 0; transform: translate(0, 0) scale(1); }
}
@keyframes kSauce {
  0%, 36% { opacity: 0; transform: scale(.05); }
  38%   { opacity: 1; transform: scale(.2); }
  46%, 100% { opacity: 1; transform: scale(1); }
}
@keyframes kTop {
  0%, 46% { opacity: 0; transform: translateY(-30px); }
  50%, 100% { opacity: 1; transform: translateY(0); }
}
@keyframes kCooked { 0%, 73% { opacity: 0; } 76%, 100% { opacity: .32; } }
@keyframes kSteam {
  0%, 75% { opacity: 0; transform: translateY(0); }
  78%   { opacity: .9; transform: translateY(-3px); }
  84%   { opacity: .9; transform: translateY(-8px); }
  90%   { opacity: .8; transform: translateY(-4px); }
  94%   { opacity: 0; transform: translateY(-10px); }
  100%  { opacity: 0; transform: translateY(0); }
}
@keyframes kGlow  { 0% { opacity: .25; } 54% { opacity: .3; } 62% { opacity: .7; } 66% { opacity: .9; } 68% { opacity: .7; } 70% { opacity: .95; } 72% { opacity: .75; } 75% { opacity: .6; } 86% { opacity: .4; } 100% { opacity: .25; } }
@keyframes kBloom { 0% { opacity: .12; } 54% { opacity: .15; } 62% { opacity: .35; } 70% { opacity: .55; } 75% { opacity: .4; } 86% { opacity: .22; } 100% { opacity: .12; } }
@keyframes kArmR {
  0% { transform: rotate(20deg); } 6% { transform: rotate(30deg); } 9% { transform: rotate(48deg); }
  12% { transform: rotate(30deg); } 15% { transform: rotate(50deg); } 18% { transform: rotate(30deg); }
  21% { transform: rotate(52deg); } 23% { transform: rotate(-38deg); } 26% { transform: rotate(-22deg); }
  28.5% { transform: rotate(-8deg); } 31% { transform: rotate(30deg); } 34% { transform: rotate(40deg); }
  38% { transform: rotate(46deg); } 40% { transform: rotate(30deg); } 42% { transform: rotate(46deg); }
  44% { transform: rotate(30deg); } 46% { transform: rotate(14deg); } 48% { transform: rotate(22deg); }
  49.5% { transform: rotate(10deg); } 51% { transform: rotate(22deg); } 52.5% { transform: rotate(10deg); }
  54% { transform: rotate(34deg); } 59% { transform: rotate(2deg); } 63% { transform: rotate(18deg); }
  73% { transform: rotate(18deg); } 77% { transform: rotate(22deg); } 82% { transform: rotate(38deg); }
  93% { transform: rotate(38deg); } 100% { transform: rotate(20deg); }
}
@keyframes kSpoon { 0%, 35% { opacity: 0; } 36.5%, 45% { opacity: 1; } 46.5%, 100% { opacity: 0; } }
@keyframes kArmL {
  0%, 86% { transform: rotate(-82deg); } 88.5% { transform: rotate(50deg); } 89.5% { transform: rotate(30deg); }
  91% { transform: rotate(55deg); } 92.5% { transform: rotate(32deg); } 94.5%, 100% { transform: rotate(-82deg); }
}
@keyframes kBow {
  0%, 62% { transform: rotate(0deg); } 66% { transform: rotate(3deg); } 72% { transform: rotate(5deg); }
  76%, 89% { transform: rotate(0deg); } 91%, 93.5% { transform: rotate(9deg); } 96%, 100% { transform: rotate(0deg); }
}
@keyframes kGlance { 0%, 68% { transform: translateX(0); } 70%, 73% { transform: translateX(2.5px); } 75%, 100% { transform: translateX(0); } }
@keyframes kWink { 0%, 86.5% { transform: scaleY(1); } 87.5%, 88.5% { transform: scaleY(.1); } 89.5%, 100% { transform: scaleY(1); } }
@keyframes kFoot {
  0%, 65% { transform: rotate(0deg); } 66% { transform: rotate(-16deg); } 67.4% { transform: rotate(0deg); }
  68.8% { transform: rotate(-16deg); } 70.2% { transform: rotate(0deg); } 71.6% { transform: rotate(-16deg); } 73%, 100% { transform: rotate(0deg); }
}

/* tap the chef: a short dough toss from the hand + a speech bubble (loop is paused meanwhile) */
.scene.toss .tossArm { transform-origin: 152px 100px; animation: kTossFlick 1.1s ease-in-out both; }
.scene.toss .bonus   { transform-origin: 192px 90px; animation: kBonus 1.1s ease-in-out both; }
.scene.toss .bubble  { transform-origin: 168px 44px; animation: kBubble 1.8s ease-out both; }
@keyframes kTossFlick { 0% { transform: rotate(0deg); } 12% { transform: rotate(14deg); } 28% { transform: rotate(-34deg); } 50% { transform: rotate(-8deg); } 80%, 100% { transform: rotate(0deg); } }
@keyframes kBonus {
  0% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  6% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  30% { opacity: 1; transform: translate(0, -26px) rotate(120deg) scale(1.3, .8); }
  50% { opacity: 1; transform: translate(0, -62px) rotate(360deg) scale(1.7, .4); }
  75% { opacity: 1; transform: translate(0, -20px) rotate(600deg) scale(1.5, .7); }
  92% { opacity: 1; transform: translate(0, 0) rotate(720deg) scale(1, 1); }
  100% { opacity: 0; transform: translate(0, 0) rotate(720deg) scale(1, 1); }
}
@keyframes kBubble {
  0% { opacity: 0; transform: scale(.6); } 14% { opacity: 1; transform: scale(1.06); } 24% { opacity: 1; transform: scale(1); }
  85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.9); }
}

/* Ask Fiore hat tilts on hover (mouse) or press (touch) */
@keyframes kTilt { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-14deg); } 65% { transform: rotate(9deg); } }
.ask-fab:active .icon, .ask-fab:focus-visible .icon { animation: kTilt 0.5s ease-in-out; }
@media (hover: hover) { .ask-fab:hover .icon { animation: kTilt 0.5s ease-in-out; } }

/* cart "fly" icon + filtered cards stagger in (reuses fadeUp) */
.fly { position: fixed; z-index: 40; width: 30px; height: 30px; pointer-events: none; }
.card.enter { animation: fadeUp 0.24s ease-out both; animation-delay: var(--d, 0ms); }

@media (prefers-reduced-motion: reduce) {
  .speed, .fx-toggle { display: none !important; }     /* nothing to speed up or switch off */
  .scene.toss .bubble { opacity: 1; }      /* tap still shows the speech bubble, without any movement */
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes bump { 40% { transform: scale(1.22); } }
#cbCount { display: inline-block; }
#cbCount.bump { animation: bump 0.3s ease-out; }

/* ---------- Search + filters ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 12px; align-items: flex-end; }
.search { flex: 1 1 100%; min-width: 0; }
.search label { display: block; margin-bottom: 4px; font-size: 0.9rem; font-weight: 700; color: var(--olive); }
.search input {
  width: 100%;
  min-height: 46px;
  padding: 0 14px;
  font: inherit;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--olive);
  border-radius: 12px;
}
.search input::placeholder { color: var(--ink-soft); }
/* One segmented filter: All / Veg / Non-veg (real radio buttons, so arrow keys work) */
.seg { display: flex; gap: 3px; flex: 1 1 100%; padding: 3px; background: #f1e4cf; border: 1px solid var(--olive-line); border-radius: 14px; }
.seg label { position: relative; flex: 1 1 0; display: flex; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span {
  flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0 12px;
  font-weight: 700; color: var(--olive);
  border-radius: 11px;
  transition: background 0.2s, color 0.2s, transform 0.18s;
}
.seg label:hover input:not(:checked) + span { background: #e8d9bf; }
.seg input:checked + span { background: var(--basil); color: #fff; box-shadow: 0 1px 3px rgba(47, 107, 58, 0.4); }
.seg input:checked + span::before { content: "\2713"; margin-right: 6px; }
.seg label:active span { transform: translateY(1px); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 12px; }
.count { flex: 1 1 100%; margin: 0; font-size: 0.9rem; color: var(--ink-soft); }
.count:empty { display: none; }

input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* ---------- Sticky category tabs ---------- */
.tabs {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: 8px calc(var(--pad) * -1) 0;
  padding: 6px var(--pad);
  background: var(--paper);
  border-bottom: 1px solid var(--olive-line);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; }
.tabs a {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 0 18px;
  white-space: nowrap;
  font-weight: 700;
  text-decoration: none;
  color: var(--olive);
  background: #fff;
  border: 1px solid var(--olive-line);
  border-radius: 999px;
  transition: background 0.2s, border-color 0.2s;
}
.tabs a:hover { border-color: var(--olive); }
.tabs a[aria-current="true"] { background: var(--butter); border-color: var(--olive); color: var(--ink); box-shadow: inset 0 -3px 0 var(--tomato); }

/* ---------- Sections ---------- */
.cat { scroll-margin-top: var(--tabs-offset); padding-top: 14px; }
.cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cat-head .icon { width: 38px; height: 38px; }
.cat-head h2 {

}

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 12px; }

/* ---------- Dish cards ---------- */
.card {

  gap: 8px;
  padding: 12px 14px;
  background: #fffdf8;
  border: 1px solid var(--olive-line);
  border-radius: 14px;

}
/* only devices with a real hover (mouse/trackpad) get the 2px lift */
@media (hover: hover) {
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(110, 80, 40, 0.2); border-color: #bfae85; }
}
/* cards slide/fade in once as they enter the screen (only when JavaScript is running) */
.js .card.reveal:not(.in) { opacity: 0; transform: translateY(10px); }
@media (prefers-reduced-motion: reduce) {

}
.card-top { display: flex; gap: 12px; align-items: flex-start; }
.art { width: 54px; height: 54px; flex: none; }
.body { min-width: 0; }
.card h3 { margin: 0; font-size: 1.22rem; line-height: 1.2; font-weight: 800; color: var(--ink); }
.desc { margin: 3px 0 0; font-size: 0.97rem; color: var(--ink-soft); }
.meta { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 0.9rem; font-weight: 700; }
.diet { display: inline-flex; align-items: center; gap: 6px; }
.diet .dot { width: 11px; height: 11px; border-radius: 50%; }
.diet.veg { color: var(--basil); } .diet.veg .dot { background: #2e9e48; }
.diet.nonveg { color: var(--red); } .diet.nonveg .dot { background: #d62d2d; }
.portion { color: var(--ink-soft); font-weight: 600; }
.portion::before { content: "\00b7"; margin-right: 10px; }

/* price + Add always sit along the bottom of the card */
.buy {
  margin-top: auto;
  padding-top: 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-top: 1px dotted var(--olive-line);
}
.price { font-size: 1.3rem; font-weight: 800; color: var(--ink); }
.add {
  min-height: 44px; min-width: 104px;

  color: #fff;

  border-radius: 12px;

}

/* ---------- No results ---------- */

  min-height: 46px; padding: 0 24px; font: inherit; font-weight: 800;

}

.foot { margin: 26px 0 0; text-align: center; font-size: 0.88rem; color: var(--ink-soft); }

/* ---------- Back to top ---------- */
/* sits inside the bottom bar, to the left of the cart button, so it never covers a dish */
.to-top {
  flex: none; width: 48px; height: 48px;
  display: grid; place-items: center;
  font-size: 1.3rem;
  color: var(--olive); background: var(--paper);
  border: 1px solid var(--olive); border-radius: 14px;
  box-shadow: 0 3px 10px rgba(60, 45, 20, 0.3);

.price-col { display: flex; flex-direction: column; justify-content: center; min-height: 44px; }

/* ---------- Cart bar (always at the bottom) ---------- */

.cartbar {

}
.cartbar-in { display: flex; gap: 8px; max-width: 960px; margin: 0 auto; pointer-events: auto; }
#cartBtn {

}
#cartBtn:hover { background: #255a30; }
#cartBtn:active { transform: translateY(1px); }
.cb-left, .cb-right { display: flex; align-items: center; gap: 10px; }

.cb-right span { font-weight: 600; opacity: 0.95; }

/* ---------- Cart panel (bottom sheet) ---------- */
#cartDialog {
  width: 100%; max-width: 520px; max-height: 86vh;
  margin: auto auto 0;
  padding: 0;

}

  width: 44px; height: 44px; font-size: 1.4rem; font-weight: 800; line-height: 1;

}

.qty { min-width: 36px; text-align: center; font-size: 1.15rem; font-weight: 800; }
.line-price { font-size: 1.15rem; font-weight: 800; text-align: right; }
.cd-empty { padding: 30px 10px 34px; text-align: center; }
.cd-empty .icon { width: 64px; height: 64px; }

.cd-foot {

/* buttons used in the cart, order forms and pages */
.btn {

/* checkout form */
.cd-form { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; margin: 0; }

.cd-done { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }

.orders-link {

}

.order-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.order-card {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 14px; color: inherit; text-decoration: none;

.oc-num { font-weight: 800; font-size: 1.15rem; }
.oc-time { font-size: 0.9rem; color: var(--ink-soft); }
.oc-right { text-align: right; }
.oc-total { font-weight: 800; font-size: 1.15rem; }
.status { display: inline-block; margin-top: 2px; padding: 2px 10px; font-size: 0.85rem; font-weight: 800; color: var(--ink); background: var(--butter); border: 1px solid var(--olive-line); border-radius: 999px; }
.status.delivered { color: #fff; background: var(--basil); border-color: var(--basil); }
.none { margin-top: 20px; padding: 26px 18px; text-align: center; border: 1px dashed var(--olive); border-radius: 16px; background: #fffdf6; font-weight: 700; }

.steps { list-style: none; display: flex; margin: 18px 0 6px; padding: 0; }

.step::before { content: ""; position: absolute; top: 17px; left: -50%; width: 100%; height: 4px; background: var(--olive-line); }
.step:first-child::before { display: none; }

.step .dot {

  width: 38px; height: 38px; margin: 0 auto 6px;
  font-weight: 800; font-size: 1.05rem; color: var(--ink-soft);
  background: #fff; border: 2px solid var(--olive-line); border-radius: 50%;
}
.step.done .dot { color: #fff; background: var(--basil); border-color: var(--basil); }
.step.current .dot { color: var(--ink); background: var(--butter); border-color: var(--olive); box-shadow: 0 0 0 4px rgba(246, 215, 104, 0.45); }
.step.current { color: var(--ink); font-weight: 800; }
.t-card { margin-top: 14px; padding: 4px 14px 10px; background: #fffdf6; border: 1px solid var(--olive-line); border-radius: 14px; }

.t-card .sum { margin-top: 6px; }
.t-details { margin: 8px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

.ask-fab {

.ask-chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 44px; padding: 0 14px; white-space: nowrap;
  font: inherit; font-weight: 700; color: var(--olive);
  background: #fff; border: 1px solid var(--olive-line); border-radius: 999px; cursor: pointer;

}
.chip:hover { border-color: var(--olive); background: #f6efd9; }
.chip:active { transform: translateY(1px) scale(0.97); }
.ask-form { display: flex; gap: 8px; padding: 4px 12px calc(12px); }
.ask-form input {
  flex: 1 1 auto; min-width: 0; min-height: 46px; padding: 0 12px;
  font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--olive); border-radius: 12px;
}

.card { scroll-margin-top: calc(var(--tabs-offset) + 8px); }
@media (min-width: 760px) {

}

  .page { padding: 6px 20px calc(88px + env(safe-area-inset-bottom)); }

<script>
/* =========================================================
   1. THE MENU  -  EDIT DISHES AND PRICES HERE ONLY
   ---------------------------------------------------------
   Each category has: id, name, icon, dishes.
   Each dish has:
     name    - dish name
     portion - size shown next to the Veg tag ("" if none)
     desc    - short description
     price   - number only; the page shows it as "Rs 220"
     veg     - true = Veg (green dot), false = Non-veg (red dot)
     art     - which little drawing to show (see list below)
   Drawings: bruschetta caprese melon soup pizza pasta penne
             risotto carbonara lasagna chicken focaccia ciabatta

   ========================================================= */
const MENU = [
  {

      { name: "Lasagna alla Bolognese",   portion: "1 portion", desc: "Lasagna layered with meat ragu.", price: 290, veg: false, art: "lasagna" },
      { name: "Pollo alla Cacciatora",    portion: "2 pcs",     desc: "Chicken cooked hunter-style.", price: 300, veg: false, art: "chicken" }
    ]
  },
  {
    id: "breads", name: "Breads", icon: "ciabatta",
    dishes: [
      { name: "Focaccia al Rosmarino",   portion: "1 slice", desc: "Rosemary bread, by the slice.", price: 70, veg: true, art: "focaccia" },

    ]
  },
  {
    id: "drinks", name: "Drinks", icon: "espresso",
    dishes: [
      { name: "Caffe Espresso",  portion: "",       desc: "Classic Italian espresso.", price: 60, veg: true, art: "espresso" },
      { name: "Cappuccino",      portion: "",       desc: "A classic Italian coffee.", price: 90, veg: true, art: "cappuccino" },
      { name: "Limonata",        portion: "Glass",  desc: "A lemon drink, served by the glass.", price: 80, veg: true, art: "lemon" },
      { name: "Acqua Frizzante", portion: "Bottle", desc: "Sparkling water.", price: 70, veg: true, art: "bottle" }
    ]
  },
  {
    id: "desserts", name: "Desserts", icon: "gelato",
    dishes: [
      { name: "Tiramisu",           portion: "1 portion", desc: "A classic Italian dessert. Contains egg.", price: 150, veg: false, art: "tiramisu" },
      { name: "Affogato al Caffe",  portion: "1 serving", desc: "Gelato with espresso.", price: 130, veg: true,  art: "affogato" },
      { name: "Sorbetto al Limone", portion: "1 scoop",   desc: "Lemon sorbet.", price: 90, veg: true,  art: "sorbet" }
    ]
  }
];

/* =========================================================
   2. BUILD THE PAGE FROM THE MENU  (no need to edit below)
   ========================================================= */
var menuEl = document.getElementById("menu");
var emptyEl = document.getElementById("empty");
var tabsEl = document.getElementById("tabs");
var tabList = tabsEl.querySelector("ul");
var countEl = document.getElementById("count");
var searchEl = document.getElementById("search");
var toTopEl = document.getElementById("toTop");
var dietRadios = document.querySelectorAll('.seg input[name="diet"]');

// Small helper: make an element with a class and text
function make(tag, className, text) {
  var e = document.createElement(tag);
  if (className) e.className = className;
  if (text) e.textContent = text;
  return e;
}
// Small helper: make a drawing from the <symbol> list above
function drawing(id, className) {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", className);
  svg.setAttribute("viewBox", "0 0 48 48");
  svg.setAttribute("aria-hidden", "true");
  var use = document.createElementNS(NS, "use");
  use.setAttribute("href", "#i-" + id);
  svg.appendChild(use);
  return svg;
}

var sections = [];   // one entry per category: its section, tab link and cards
var dishByKey = {};  // finds a dish (and its price) from its key, for the cart
var cart = {};       // { dishKey: quantity }

MENU.forEach(function (cat) {
  // Tab
  var li = make("li");
  var link = make("a", "", cat.name);
  link.href = "#cat-" + cat.id;
  li.appendChild(link);
  tabList.appendChild(li);

  // Section with heading
  var section = make("section", "cat");
  section.id = "cat-" + cat.id;
  section.setAttribute("aria-labelledby", "h-" + cat.id);

  var head = make("div", "cat-head");
  head.appendChild(drawing(cat.icon, "icon"));
  var h2 = make("h2", "", cat.name);
  h2.id = "h-" + cat.id;
  head.appendChild(h2);
  head.appendChild(make("span", "rule"));
  section.appendChild(head);

  // Dish cards
  var grid = make("ul", "grid");
  var cards = [];
  cat.dishes.forEach(function (dish) {
    var card = make("li", "card reveal");

    var top = make("div", "card-top");
    top.appendChild(drawing(dish.art, "art"));
    var body = make("div", "body");
    body.appendChild(make("h3", "", dish.name));
    body.appendChild(make("p", "desc", dish.desc));

    var meta = make("div", "meta");
    var diet = make("span", "diet " + (dish.veg ? "veg" : "nonveg"));
    diet.appendChild(make("span", "dot"));
    diet.appendChild(document.createTextNode(dish.veg ? "Veg" : "Non-veg"));
    meta.appendChild(diet);
    if (dish.portion) meta.appendChild(make("span", "portion", dish.portion));
    body.appendChild(meta);
    top.appendChild(body);
    card.appendChild(top);

    var key = cat.id + "|" + dish.name;
    dishByKey[key] = dish;

    var buy = make("div", "buy");
    var priceCol = make("div", "price-col");
    priceCol.appendChild(make("span", "price", "Rs " + dish.price));
    var inCart = make("span", "incart");          // "2 in cart", filled in by the cart code
    inCart.hidden = true;
    priceCol.appendChild(inCart);
    buy.appendChild(priceCol);
    var add = make("button", "add", "+ Add");
    add.type = "button";
    add.setAttribute("aria-label", "Add " + dish.name + " to cart");
    add.addEventListener("click", function () { changeQty(key, 1, add); });
    buy.appendChild(add);
    card.appendChild(buy);

    grid.appendChild(card);
    cards.push({ el: card, name: dish.name, veg: dish.veg, key: key, inCart: inCart });
  });
  section.appendChild(grid);
  menuEl.insertBefore(section, emptyEl);

  sections.push({ cat: cat, section: section, link: link, li: li, cards: cards });
});

/* =========================================================
   3. SEARCH + FILTER
   ========================================================= */
var mode = "all";   // "all", "veg" or "nonveg"

// Lower-case and remove accents so "ragu" finds "ragù"
function clean(text) {
  return text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

function applyFilters() {
  var query = clean(searchEl.value.trim());
  var total = 0, shown = 0;
  var newlyShown = [];   // cards that were hidden and are visible again: only these get the little entrance

  sections.forEach(function (s) {
    var visibleHere = 0;
    s.cards.forEach(function (c) {
      total++;
      var okDiet = mode === "all" || (mode === "veg" ? c.veg : !c.veg);
      var okText = query === "" || clean(c.name).indexOf(query) !== -1;
      var wasHidden = c.el.hidden;
      c.el.hidden = !(okDiet && okText);
      if (!c.el.hidden) {
        visibleHere++;
        if (wasHidden) newlyShown.push(c.el);
      }
    });
    // Hide empty categories and their tabs
    s.section.hidden = visibleHere === 0;
    s.li.hidden = visibleHere === 0;
    shown += visibleHere;
  });

  // Short stagger for cards that just came back (max 8). Visible cards never replay, so typing stays calm.
  newlyShown.slice(0, 8).forEach(function (el, i) {
    el.classList.add("in");                       // skip the scroll reveal for these
    el.style.setProperty("--d", (i * 40) + "ms");
    el.classList.remove("enter");
    void el.offsetWidth;                          // lets the animation restart
    el.classList.add("enter");
    el.addEventListener("animationend", function done(e) {
      if (e.target !== el) return;
      el.classList.remove("enter");
      el.removeEventListener("animationend", done);
    });
  });

  emptyEl.hidden = shown !== 0;
  tabsEl.hidden = shown === 0;
  countEl.textContent = shown === total
    ? ""   // nothing filtered: no need for a count line
    : "Showing " + shown + " of " + total + " dishes";
  setOffset();
  updateActive();
}

searchEl.addEventListener("input", applyFilters);

var DIET_KEY = "casafiore-diet";

// Tick the radio button that matches the current filter
function showDiet() {
  dietRadios.forEach(function (r) { r.checked = r.value === mode; });
}

// One place that changes the diet filter and remembers it
function setDiet(newMode) {
  mode = newMode;
  showDiet();
  try { localStorage.setItem(DIET_KEY, mode); } catch (e) { /* storage blocked: still works until refresh */ }
  applyFilters();
}

dietRadios.forEach(function (r) {
  r.addEventListener("change", function () { if (r.checked) setDiet(r.value); });
});

document.getElementById("clear").addEventListener("click", function () {
  searchEl.value = "";
  setDiet("all");
  searchEl.focus();
});

// Restore the saved choice after a refresh (applyFilters runs at the end of the script)
(function () {
  var saved = "all";
  try { saved = localStorage.getItem(DIET_KEY) || "all"; } catch (e) {}
  if (saved !== "veg" && saved !== "nonveg") saved = "all";
  mode = saved;
  showDiet();
})();

/* =========================================================
   4. TAB JUMPS, ACTIVE HIGHLIGHT, BACK TO TOP
   ========================================================= */
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function setActive(s) {
  sections.forEach(function (x) {
    if (x === s) x.link.setAttribute("aria-current", "true");
    else x.link.removeAttribute("aria-current");
  });
  // Keep the active tab in view inside the scrolling row
  if (s && tabsEl.scrollWidth > tabsEl.clientWidth) {
    var left = s.link.offsetLeft - (tabsEl.clientWidth - s.link.offsetWidth) / 2;
    tabsEl.scrollTo({ left: left, behavior: reduceMotion ? "auto" : "smooth" });
  }
}

// Highlight the category currently just under the sticky tabs
function updateActive() {
  var visible = sections.filter(function (s) { return !s.section.hidden; });
  if (visible.length === 0) return;
  var line = tabsEl.offsetHeight + 40;
  var current = visible[0];
  visible.forEach(function (s) {
    if (s.section.getBoundingClientRect().top <= line) current = s;
  });
  var atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
  if (atBottom) current = visible[visible.length - 1];
  setActive(current);
}

sections.forEach(function (s) {
  s.link.addEventListener("click", function (e) {
    e.preventDefault();
    s.section.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    setActive(s);
  });
});

var ticking = false;
window.addEventListener("scroll", function () {
  toTopEl.hidden = window.scrollY < 500 || currentView !== "menu";
  if (!ticking) {
    ticking = true;
    requestAnimationFrame(function () { updateActive(); ticking = false; });
  }
}, { passive: true });

// Section headings must clear the sticky tabs when we jump to them
function setOffset() {
  document.documentElement.style.setProperty("--tabs-offset", (tabsEl.offsetHeight + 6) + "px");
}
window.addEventListener("resize", function () { setOffset(); updateActive(); });

toTopEl.addEventListener("click", function () {
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
});

/* =========================================================
   5. CART  (remembered in this browser, so a refresh keeps it)
   ========================================================= */
var CART_KEY = "casafiore-cart";
var cartDialog = document.getElementById("cartDialog");
var cdBody = document.getElementById("cdBody");
var cdFoot = document.getElementById("cdFoot");
var announceEl = document.getElementById("announce");
var lastFocus = null;   // remembers which cart button was used, so keyboard focus stays put
var cdForm = document.getElementById("cdForm");
var cdDone = document.getElementById("cdDone");
var cartTitle = document.getElementById("cartTitle");
var dialogMode = "cart";   // the cart panel has 3 steps: "cart", "checkout", "done"

// Show only the part of the cart panel that belongs to the current step
function setMode(mode) {
  dialogMode = mode;
  cartTitle.textContent = mode === "cart" ? "Your cart" : mode === "checkout" ? "Your details" : "Order placed";
  cdBody.hidden = mode !== "cart";
  cdFoot.hidden = mode !== "cart" || Object.keys(cart).length === 0;
  cdForm.hidden = mode !== "checkout";
  cdDone.hidden = mode !== "done";
}

function money(n) { return "Rs " + n; }

// A small copy of the dish drawing arcs from the Add button to the cart count (transform + opacity only)
function flyToCart(key, fromEl) {
  var target = document.getElementById("cbCount");
  var from = fromEl.getBoundingClientRect(), to = target.getBoundingClientRect();
  if (reduceMotion || !fromEl.animate || cartBar.hidden || from.width === 0 || to.width === 0) { bumpCount(); return; }
  var art = dishByKey[key].art;
  var NS = "http://www.w3.org/2000/svg";
  var icon = document.createElementNS(NS, "svg");
  icon.setAttribute("class", "fly");
  icon.setAttribute("viewBox", "0 0 48 48");
  icon.setAttribute("aria-hidden", "true");
  var use = document.createElementNS(NS, "use");
  use.setAttribute("href", "#i-" + art);
  icon.appendChild(use);
  icon.style.left = (from.left + from.width / 2 - 15) + "px";
  icon.style.top = (from.top + from.height / 2 - 15) + "px";
  document.body.appendChild(icon);
  var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  var run = icon.animate([
    { transform: "translate(0, 0) scale(1)", opacity: 1 },
    { transform: "translate(" + dx * 0.5 + "px, " + (dy * 0.4 - 36) + "px) scale(1.1)", opacity: 1, offset: 0.5 },
    { transform: "translate(" + dx + "px, " + dy + "px) scale(0.45)", opacity: 0.25 }
  ], { duration: 650, easing: "ease-in", fill: "forwards" });
  run.onfinish = function () { icon.remove(); bumpCount(); };
  run.oncancel = function () { icon.remove(); };
}

// Tiny pop on the cart count after a successful change
function bumpCount() {
  var el = document.getElementById("cbCount");
  el.classList.remove("bump");
  void el.offsetWidth;            // lets the animation restart
  el.classList.add("bump");
}

function saveCart() {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) { /* storage blocked: cart still works until refresh */ }
}

function loadCart() {
  try {
    var saved = JSON.parse(localStorage.getItem(CART_KEY) || "{}");
    Object.keys(saved).forEach(function (key) {
      var q = Math.floor(Number(saved[key]));
      if (dishByKey[key] && q > 0) cart[key] = Math.min(q, 99);   // ignore dishes no longer on the menu
    });
  } catch (e) { /* nothing saved, or storage blocked */ }
}

// Add (+1) or remove (-1) one of a dish. Going below 1 removes it.
function changeQty(key, change, fromButton) {
  var before = cart[key] || 0;
  var q = before + change;
  if (q <= 0) delete cart[key];
  else cart[key] = Math.min(q, 99);
  if ((cart[key] || 0) === before) return;   // nothing changed (e.g. already at 99)
  saveCart();
  renderCart();                              // the real cart logic: quantities and totals are final here
  // Decoration only: a tiny dish icon flies to the cart, then the count pops
  if (fromButton && change > 0) flyToCart(key, fromButton);
  else bumpCount();
  announceEl.textContent = dishByKey[key].name + (cart[key] ? ": " + cart[key] + " in cart" : " removed from cart");
}

function renderCart() {
  var count = 0, total = 0, lines = [];
  Object.keys(cart).forEach(function (key) {
    var dish = dishByKey[key];
    count += cart[key];
    total += dish.price * cart[key];
    lines.push({ key: key, dish: dish, qty: cart[key] });
  });

  // Bar at the bottom
  document.getElementById("cbCount").textContent = count + (count === 1 ? " item" : " items");
  document.getElementById("cbTotal").textContent = money(total);

  // "2 in cart" note on each dish card
  sections.forEach(function (s) {
    s.cards.forEach(function (c) {
      var q = cart[c.key] || 0;
      c.inCart.hidden = q === 0;
      c.inCart.textContent = q + " in cart";
    });
  });

  // Cart panel
  cdBody.textContent = "";
  if (lines.length === 0) {
    var empty = make("div", "cd-empty");
    empty.appendChild(drawing("pasta", "icon"));
    empty.appendChild(make("p", "", "Your cart is empty"));
    empty.appendChild(make("small", "", "Pick something tasty from the menu and it will show up here."));
    cdBody.appendChild(empty);
  } else {
    var list = make("ul", "lines");
    lines.forEach(function (l) {
      var li = make("li", "line");
      li.appendChild(make("span", "line-name", l.dish.name));

      var stepper = make("div", "stepper");
      var minus = make("button", "", "−");
      minus.type = "button";
      minus.setAttribute("data-key", l.key);
      minus.setAttribute("data-change", "-1");
      minus.setAttribute("aria-label", l.qty === 1 ? "Remove " + l.dish.name + " from cart" : "One less " + l.dish.name);
      var qty = make("span", "qty", String(l.qty));
      var plus = make("button", "", "+");
      plus.type = "button";
      plus.setAttribute("data-key", l.key);
      plus.setAttribute("data-change", "1");
      plus.setAttribute("aria-label", "One more " + l.dish.name);
      stepper.appendChild(minus);
      stepper.appendChild(qty);
      stepper.appendChild(plus);
      li.appendChild(stepper);

      li.appendChild(make("span", "line-price", money(l.dish.price * l.qty)));
      list.appendChild(li);
    });
    cdBody.appendChild(list);
  }
  document.getElementById("cdTotal").textContent = money(total);
  document.getElementById("fmTotal").textContent = money(total);
  setMode(dialogMode);

  // Put keyboard focus back on the button that was just used
  if (lastFocus && cartDialog.open) {
    var again = cdBody.querySelector('[data-key="' + lastFocus.key + '"][data-change="' + lastFocus.change + '"]');
    (again || document.getElementById("cartClose")).focus();
  }

}

var ORDERS_KEY = "casafiore-orders";

function loadOrders() {
  try {
    var list = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}
function saveOrders(list) {       // returns false if the browser would not save it
  try { localStorage.setItem(ORDERS_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}
function findOrder(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}
// First order is 1001, then 1002, 1003 ...
function nextOrderNumber(list) {
  var n = 1000;
  list.forEach(function (o) { if (o.id > n) n = o.id; });
  return n + 1;
}
function formatTime(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
}

// Accepts 98765 43210, 98765-43210, +91 98765 43210, 091..., etc. Returns 10 digits or null.
function cleanPhone(raw) {
  var d = raw.replace(/[\s\-().]/g, "");
  if (/^\+91\d{10}$/.test(d)) d = d.slice(3);
  else if (/^91\d{10}$/.test(d)) d = d.slice(2);
  else if (/^0\d{10}$/.test(d)) d = d.slice(1);
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}

function showError(fieldId, errId, message) {
  var field = document.getElementById(fieldId);
  var err = document.getElementById(errId);
  err.hidden = !message;
  err.textContent = message || "";
  if (field) { if (message) field.setAttribute("aria-invalid", "true"); else field.removeAttribute("aria-invalid"); }
}

// Checks the form. Shows a message under each wrong field and returns the first wrong field (or null).
function validateForm() {
  var firstBad = null;
  var name = document.getElementById("fName").value.trim();
  var phone = document.getElementById("fPhone").value.trim();
  var address = document.getElementById("fAddress").value.trim();
  var pay = cdForm.querySelector('input[name="pay"]:checked');

  var nameMsg = name.length < 2 ? "Please enter your name." : "";
  var phoneMsg = cleanPhone(phone) ? "" : "Please enter a 10-digit mobile number, like 98765 43210.";
  var addressMsg = address.length < 10 ? "Please enter your full delivery address." : "";
  var payMsg = pay ? "" : "Please choose how you will pay.";

  showError("fName", "eName", nameMsg);
  showError("fPhone", "ePhone", phoneMsg);
  showError("fAddress", "eAddress", addressMsg);
  showError(null, "ePay", payMsg);

  if (nameMsg) firstBad = document.getElementById("fName");
  else if (phoneMsg) firstBad = document.getElementById("fPhone");
  else if (addressMsg) firstBad = document.getElementById("fAddress");
  else if (payMsg) firstBad = cdForm.querySelector('input[name="pay"]');

}

// Submitting the form: check it, save the order, empty the cart, show the confirmation
cdForm.addEventListener("submit", function (e) {
  e.preventDefault();
  var bad = validateForm();
  if (bad) { bad.focus(); return; }

  // Copy the dishes as they are in the cart right now (name, price, quantity)
  var items = [], total = 0;
  Object.keys(cart).forEach(function (key) {
    var dish = dishByKey[key];
    items.push({ name: dish.name, price: dish.price, qty: cart[key] });
    total += dish.price * cart[key];
  });
  if (items.length === 0) return;

  var orders = loadOrders();
  var order = {
    id: nextOrderNumber(orders),
    time: new Date().toISOString(),
    name: document.getElementById("fName").value.trim(),
    phone: "+91 " + cleanPhone(document.getElementById("fPhone").value.trim()),
    address: document.getElementById("fAddress").value.trim(),
    payment: cdForm.querySelector('input[name="pay"]:checked').value,
    items: items,
    total: total,
    status: "Placed"
  };
  orders.push(order);
  if (!saveOrders(orders)) {
    showError(null, "ePay", "Sorry, this browser would not save the order. Your cart is still here, please try again.");
    return;
  }

  // Empty the cart and reset the form for next time
  cart = {};
  saveCart();
  cdForm.reset();
  showConfirmation(order);
  renderCart();
});

/* =========================================================
   8. ASK FIORE - OFFLINE MENU HELPER (not AI)
   Simple rules that read ONLY the MENU array above:
   Veg / Non-veg, category, dish name and "under Rs X" (per dish).
   It never makes up ingredients, allergens, ratings or availability.
   ========================================================= */
var askBtn = document.getElementById("askBtn");
var askPanel = document.getElementById("askPanel");
var askLog = document.getElementById("askLog");
var askChips = document.getElementById("askChips");
var askForm = document.getElementById("askForm");
var askInput = document.getElementById("askInput");

var choose = null;          // set while "Help me choose" is asking its two questions
var MAX_RESULTS = 8;
var DEFAULT_CHIPS = ["Veg dishes under Rs 150", "Non-veg mains", "Desserts", "Drinks", "Help me choose"];

// Flat list of every dish with its category (built from MENU, so prices always match)
var ALL = [];
MENU.forEach(function (cat) {
  cat.dishes.forEach(function (d) {
    ALL.push({ cat: cat, dish: d, key: cat.id + "|" + d.name, words: norm(d.name).split(/[^a-z0-9]+/).filter(Boolean) });
  });
});

function norm(text) { return clean(text).replace(/['’]/g, ""); }

// Little filler words that should not be treated as part of a dish name
var STOP = {};
("the and for with any some all show find give list dishes dish items item food what whats have has got you your are there can could " +
 "please want need looking look like something me menu options option only just that this one tell about which ones per under below " +
 "than less rupees budget cheap cheaper eat get does how much").split(" ").forEach(function (w) { STOP[w] = true; });

function nameHas(item, w) {
  return item.words.some(function (nw) {
    return nw === w || (w.length >= 4 && nw.indexOf(w) === 0) || (nw.length >= 4 && w.length > nw.length && w.indexOf(nw) === 0);
  });
}

// Turn a sentence into filters: diet, price limit, categories and dish-name words
function parseQuery(text) {
  var q = norm(text);
  var f = { diet: null, max: null, strict: false, cats: [], words: [] };

  var bm = q.match(/\b(under|below|less than|cheaper than|up to|upto|within|max|maximum|at most)\s*(?:rs\.?|inr|₹)?\s*(\d{1,4})\b/);
  if (bm) {
    f.max = Number(bm[2]);
    f.strict = /^(under|below|less than|cheaper than)$/.test(bm[1]);
    q = q.replace(bm[0], " ");
  }

  // Non-veg is checked first and removed, so "non-veg" is never mistaken for "veg"
  var nv = /\bnon[\s-]*veg(?:etarian)?s?\b/g;
  var hasNonVeg = nv.test(q);
  q = q.replace(/\bnon[\s-]*veg(?:etarian)?s?\b/g, " ");
  var hasVeg = /\bveg(?:etarian)?s?\b/.test(q);
  q = q.replace(/\bveg(?:etarian)?s?\b/g, " ");
  if (hasNonVeg && !hasVeg) f.diet = "nonveg";
  else if (hasVeg && !hasNonVeg) f.diet = "veg";

  MENU.forEach(function (cat) {
    var base = clean(cat.name).replace(/s$/, "");
    var re = new RegExp("\\b" + base + "s?\\b");
    if (re.test(q)) { f.cats.push(cat.id); q = q.replace(new RegExp(re.source, "g"), " "); }
  });

  q.replace(/[^a-z0-9\s]/g, " ").split(/\s+/).forEach(function (w) {
    if (w.length >= 3 && !STOP[w] && !/^\d+$/.test(w)) f.words.push(w);
  });
  // keep only the words that really appear in some dish name
  f.words = f.words.filter(function (w) { return ALL.some(function (it) { return nameHas(it, w); }); });
  return f;
}

function hasFilters(f) { return !!(f.diet || f.max !== null || f.cats.length || f.words.length); }

function findDishes(f) {
  return ALL.filter(function (it) {
    if (f.diet === "veg" && !it.dish.veg) return false;
    if (f.diet === "nonveg" && it.dish.veg) return false;
    if (f.cats.length && f.cats.indexOf(it.cat.id) === -1) return false;
    if (f.max !== null && (f.strict ? it.dish.price >= f.max : it.dish.price > f.max)) return false;
    return f.words.every(function (w) { return nameHas(it, w); });
  });
}

function describe(f) {
  var parts = [];
  if (f.diet) parts.push(f.diet === "veg" ? "Veg" : "Non-veg");
  f.cats.forEach(function (id) { MENU.forEach(function (c) { if (c.id === id) parts.push(c.name); }); });
  if (f.words.length) parts.push("“" + f.words.join(" ") + "”");
  if (f.max !== null) parts.push((f.strict ? "under Rs " : "up to Rs ") + f.max + " per dish");
  return parts.join(" · ");
}

  hit.c.el.classList.add("in");
  hit.c.el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  hit.c.el.classList.add("flash");
  setTimeout(function () { hit.c.el.classList.remove("flash"); }, 2000);
  hit.c.el.querySelector(".add").focus({ preventScroll: true });
}

/* ---- the rules ---- */
var LIMIT_WORDS = /\b(ingredients?|allerg\w*|gluten|vegan|jain|halal|dairy|nuts?|spicy|spice|spiciness|calories?|healthy|popular|bestsellers?|best|ratings?|reviews?|available|availability|stock|deliver\w*|discounts?|offers?|deals?|eggs?|contains?|made of|made with)\b/;
var CART_WORDS = /\b(orders?|cart|basket|checkout|pay|payment|track\w*)\b/;
var CHOOSE_WORDS = /\b(help me (choose|decide|pick)|choose for me|recommend\w*|suggest\w*|what should i (eat|get|order|have)|not sure|surprise me)\b/;

function showShortcuts() { setChips(DEFAULT_CHIPS); }

function answerFilters(f) {
  var found = findDishes(f);
  if (found.length === 0) {
    botSay("I couldn't find any dishes for " + describe(f) + ". Try a higher budget or another category.");
  } else {
    botSay(found.length + (found.length === 1 ? " dish" : " dishes") + " for " + describe(f) + ":", found);
  }
  showShortcuts();
}

function startChoose() {
  choose = { step: "diet", diet: null };
  botSay("Happy to help you choose! First, would you like Veg or Non-veg dishes?");
  setChips(["Veg", "Non-veg", "No preference"]);
}

function handleChoose(text) {
  var q = norm(text);
  if (/\b(cancel|stop|never ?mind|exit)\b/.test(q)) { choose = null; botSay("No problem. Ask me anything about the menu."); showShortcuts(); return; }
  var f = parseQuery(text);
  if (choose.step === "diet") {
    if (/\b(no preference|any|either|both|anything|doesnt matter|does not matter)\b/.test(q)) choose.diet = null;
    else if (f.diet) choose.diet = f.diet;
    else { botSay("Please pick Veg, Non-veg or No preference."); return; }
    if (f.max === null) {
      choose.step = "budget";
      botSay("Thanks! And what is your budget per dish?");
      setChips(["Under Rs 100", "Under Rs 150", "Under Rs 200", "Any budget"]);
      return;
    }
  } else {
    var m = q.match(/^\D*(\d{1,4})\D*$/);
    if (f.max !== null) { /* typed "under Rs 150" */ }
    else if (/\b(any|no limit|no budget|anything|doesnt matter|does not matter)\b/.test(q)) { f.max = null; }
    else if (m) { f.max = Number(m[1]); f.strict = false; }
    else { botSay("Please pick a budget, or type something like “under Rs 150”."); return; }
  }
  var pick = { diet: choose.diet, max: f.max, strict: f.strict, cats: [], words: [] };
  choose = null;
  if (!hasFilters(pick)) {
    botSay("With no preference and no budget, everything fits! Try a category:");
    setChips(MENU.map(function (c) { return c.name; }));
    return;
  }
  answerFilters(pick);
}

function respond(text) {
  var q = norm(text);
  if (choose) { handleChoose(text); return; }
  if (CHOOSE_WORDS.test(q)) { startChoose(); return; }
  if (CART_WORDS.test(q)) {
    botSay("I can't place orders or change your cart. Tap + Add on a dish, then open the cart bar at the bottom of the screen.");
    showShortcuts(); return;
  }
  if (LIMIT_WORDS.test(q)) {
    botSay("I'm a simple offline helper, not AI, so I can't answer questions about ingredients, allergens, spice, ratings, popularity or availability. I can only look at dish names, categories, Veg / Non-veg and prices. Try one of these:");
    showShortcuts(); return;
  }
  var f = parseQuery(text);
  if (hasFilters(f)) { answerFilters(f); return; }
  if (/^(hi|hello|hey|hola|ciao)\b/.test(q)) {
    botSay("Ciao! Ask me about dishes by Veg / Non-veg, category or price.");
    showShortcuts(); return;
  }
  if (/\b(menu|everything|what do you (have|serve)|whats on)\b/.test(q)) {
    botSay("The menu has " + ALL.length + " dishes: " + MENU.map(function (c) { return c.name + " (" + c.dishes.length + ")"; }).join(", ") + ". Pick a category:");
    setChips(MENU.map(function (c) { return c.name; }));
    return;
  }
  botSay("Sorry, I couldn't match that to a dish, category or price. I can search dish names, categories (" +
    MENU.map(function (c) { return c.name; }).join(", ") + "), Veg / Non-veg and a price limit per dish, like “under Rs 150”. Try one of these:");
  showShortcuts();
}

function ask(text) {
  text = text.trim().slice(0, 120);
  if (!text) return;
  userSay(text);
  respond(text);
}

/* ---- open / close ---- */
function openAsk() {
  askOpen = true;
  askPanel.hidden = false;
  askBtn.hidden = true;
  askBtn.setAttribute("aria-expanded", "true");
  if (askLog.children.length === 0) {
    botSay("Hi, I'm Fiore, a simple menu helper. Ask about dishes by Veg / Non-veg, category, name or price, for example “veg mains under Rs 200”.");
    showShortcuts();
  }
  askInput.focus();
}

function closeAsk(returnFocus) {
  askOpen = false;
  askPanel.hidden = true;
  askBtn.hidden = currentView !== "menu";
  askBtn.setAttribute("aria-expanded", "false");
  if (returnFocus && !askBtn.hidden) askBtn.focus();
}

askBtn.addEventListener("click", openAsk);
document.getElementById("askClose").addEventListener("click", function () { closeAsk(true); });
askForm.addEventListener("submit", function (e) {
  e.preventDefault();
  var text = askInput.value;
  askInput.value = "";
  ask(text);
  askInput.focus();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && askOpen && !cartDialog.open) closeAsk(true);   // the cart handles its own Escape
});

/* =========================================================
   9. CHEF SCENE CONTROLS (the drawing itself is CSS keyframes)
   ========================================================= */
var scene = document.getElementById("chefScene");
var chefHit = document.getElementById("chefHit");
var speedButtons = document.querySelectorAll(".speed button");
var sceneState = { onScreen: true, tabVisible: !document.hidden, tossing: false };
var chefRate = 1;     // one shared playback rate for every chef animation

// One place decides whether the cooking loop runs (it never resets, it only waits)
function updateHold() {
  scene.classList.toggle("hold", !sceneState.onScreen || !sceneState.tabVisible || sceneState.tossing);
}

// Give every animation inside the chef scene the same playback rate.
// updatePlaybackRate keeps each animation at its current frame, so changing speed never restarts or jumps the scene.
// (Also called after the scene is shown again or a tap-toss starts, because those create fresh animations.)
function chefAnimations() {
  // only the drawing's own CSS animations (not the speed buttons' hover transitions or other UI)
  return scene.querySelector(".stage").getAnimations({ subtree: true });
}
function applyRate() {
  chefAnimations().forEach(function (a) {
    if (a.updatePlaybackRate) a.updatePlaybackRate(chefRate);
    else a.playbackRate = chefRate;
  });
}

speedButtons.forEach(function (btn) {
  btn.addEventListener("click", function () {
    chefRate = Number(btn.getAttribute("data-rate"));
    speedButtons.forEach(function (b) { b.setAttribute("aria-pressed", b === btn ? "true" : "false"); });
    applyRate();
  });
});

// Pause while the hero is off-screen or the tab is in the background
if ("IntersectionObserver" in window) {
  new IntersectionObserver(function (entries) {
    sceneState.onScreen = entries[0].isIntersecting;
    updateHold();
  }, { threshold: 0.05 }).observe(scene);
}
document.addEventListener("visibilitychange", function () {
  sceneState.tabVisible = !document.hidden;
  updateHold();
});

// Tap / Enter / Space on the chef: one short dough toss + "Perfetto!". Ignored while one is running.
chefHit.addEventListener("click", function () {
  if (sceneState.tossing) return;
  sceneState.tossing = true;
  updateHold();                         // the cooking loop waits, so two sequences never overlap
  scene.classList.add("toss");
  announceEl.textContent = "Perfetto!";
  applyRate();                          // the toss, bubble and arm flick run at the chosen speed too

  function endToss() {
    scene.classList.remove("toss");
    sceneState.tossing = false;
    updateHold();                       // the loop carries on from where it stopped
  }
  // The toss ends when its speech-bubble animation ends, so a speed change mid-toss stays in step
  var bubble = chefAnimations().filter(function (a) { return a.animationName === "kBubble"; })[0];
  if (bubble) bubble.finished.then(endToss, endToss);
  else setTimeout(endToss, 1900);       // reduced motion: no animation, so a plain timer
});

/* =========================================================
   10. CAFE ATMOSPHERE: pennants + "Background effects" switch
   (decoration only; the chef and its speed are not affected)
   ========================================================= */
(function buildPennants() {
  var svg = document.getElementById("pennants");
  var NS = "http://www.w3.org/2000/svg";
  var colours = ["#b4442a", "#fff6e0", "#2f6b3a"];                 // red, cream, green
  var rope = document.createElementNS(NS, "path");
  rope.setAttribute("d", "M0 4 Q450 24 900 4");
  rope.setAttribute("fill", "none");
  rope.setAttribute("stroke", "#8a7a5a");
  rope.setAttribute("stroke-width", "1.6");
  svg.appendChild(rope);
  for (var i = 0; i < 20; i++) {
    var t = (i + 0.5) / 20;
    var x = 900 * t;
    var y = 4 * (1 - t) * (1 - t) + 2 * 24 * t * (1 - t) + 4 * t * t;   // height of the rope at this spot
    var flag = document.createElementNS(NS, "polygon");
    flag.setAttribute("class", "pn");
    flag.setAttribute("points", (x - 9) + "," + y + " " + (x + 9) + "," + y + " " + x + "," + (y + 20));
    flag.setAttribute("fill", colours[i % 3]);
    flag.setAttribute("stroke", "#5b4a2a");
    flag.setAttribute("stroke-width", "0.8");
    flag.style.transformOrigin = x + "px " + y + "px";
    flag.style.animationDelay = (-i * 0.45) + "s";
    svg.appendChild(flag);
  }
})();

var FX_KEY = "casafiore-fx";
var fxToggles = document.querySelectorAll(".fx-toggle");
function setFx(on, save) {
  document.documentElement.classList.toggle("fx-off", !on);
  fxToggles.forEach(function (b) {
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.textContent = "Background effects: " + (on ? "On" : "Off");
  });
  if (save) { try { localStorage.setItem(FX_KEY, on ? "on" : "off"); } catch (e) {} }
}
fxToggles.forEach(function (b) {
  b.addEventListener("click", function () { setFx(b.getAttribute("aria-pressed") !== "true", true); });
});
(function () {
  var saved = "on";
  try { saved = localStorage.getItem(FX_KEY) || "on"; } catch (e) {}
  setFx(saved !== "off", false);
})();

// Hero button: scroll to the first dish section that is showing
document.getElementById("exploreBtn").addEventListener("click", function () {
  var first = sections.filter(function (s) { return !s.section.hidden; })[0];
  var target = first ? first.section : document.querySelector(".controls");
  target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
});

// Cards fade/slide in once, the first time they scroll into view
if ("IntersectionObserver" in window) {
  var revealer = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add("in"); revealer.unobserve(en.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px" });
  sections.forEach(function (s) { s.cards.forEach(function (c) { revealer.observe(c.el); }); });
} else {
  sections.forEach(function (s) { s.cards.forEach(function (c) { c.el.classList.add("in"); }); });
}

window.addEventListener("hashchange", function () { route(true); });

loadCart();
renderCart();
applyFilters();   // first load: shows every dish
route(false);     // show the right page for the current address
</script>
